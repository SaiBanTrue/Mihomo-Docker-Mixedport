name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
  schedule:
    # 每天 UTC 时间 02:00（北京时间 10:00）检查一次更新
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # 显式声明允许向 GHCR 写入镜像
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 检查上游更新
      - name: Check upstream updates
        id: check_upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 获取 mihomo 最新稳定 Release 标签
          MIHOMO_TAG=$(curl -s "https://api.github.com/repos/MetaCubeX/mihomo/releases/latest" | jq -r '.tag_name')
          
          # 获取 metacubexd 的 gh-pages 分支最新提交 Commit SHA
          METACUBEXD_SHA=$(curl -s "https://api.github.com/repos/MetaCubeX/metacubexd/commits/gh-pages" | jq -r '.sha[0:7]')

          if [ "$MIHOMO_TAG" = "null" ] || [ -z "$MIHOMO_TAG" ]; then
            echo "无法获取 mihomo 最新版本，跳过检查"
            exit 1
          fi

          echo "上游 mihomo 最新稳定版: $MIHOMO_TAG"
          echo "上游 metacubexd 最新 Commit: $METACUBEXD_SHA"

          # 设定版本复合标签
          VERSION_TAG="${MIHOMO_TAG}-${METACUBEXD_SHA}"
          echo "version_tag=$VERSION_TAG" >> $GITHUB_OUTPUT

          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/mihomo"
          echo "image_name=${IMAGE_NAME,,}" >> $GITHUB_OUTPUT

          # 如果是手动触发或代码 Push，则强制构建，不检测重复
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "trigger_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 定时任务触发时：检查 GHCR 中是否已经存在该复合标签的镜像
          EXISTS=$(curl -s -H "Authorization: Bearer $(echo -n ${{ secrets.GITHUB_TOKEN }} | base64)" \
            "https://ghcr.io/v2/${{ github.repository_owner }}/mihomo/manifests/${VERSION_TAG}" | grep -c "schemaVersion" || true)

          if [ "$EXISTS" -gt 0 ]; then
            echo "上游均无新版本，当前版本 ${VERSION_TAG} 已构建，跳过任务。"
            echo "trigger_build=false" >> $GITHUB_OUTPUT
          else
            echo "发现新版本: ${VERSION_TAG}，开始构建！"
            echo "trigger_build=true" >> $GITHUB_OUTPUT
          fi

      - name: Run pre-build script
        if: steps.check_upstream.outputs.trigger_build == 'true'
        run: bash pre_build.sh

      - name: Set up Docker Buildx
        if: steps.check_upstream.outputs.trigger_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.check_upstream.outputs.trigger_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: steps.check_upstream.outputs.trigger_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: |
            ${{ steps.check_upstream.outputs.image_name }}:latest
            ${{ steps.check_upstream.outputs.image_name }}:${{ steps.check_upstream.outputs.version_tag }}
            ${{ steps.check_upstream.outputs.image_name }}:${{ github.sha }}
